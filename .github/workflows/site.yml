name: site

# Checks every pull request, and publishes to GitHub Pages on pushes to main.
#
# One-time setup in the repository: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". The site then serves from
# https://<owner>.github.io/<repo>/. If you serve from a custom domain or a
# user/org root site, change `base` in website/.vitepress/config.mts.
#
# Requires no secrets. No DSH checkout or API key is needed to build the site:
# the curriculum is documentation, not executable code.
#
# The pnpm version comes from package.json's `packageManager` field, so CI and
# local development cannot drift apart.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: VitePress `lastUpdated` reads per-page dates from git, and
      # the default depth-1 checkout would collapse every page to one date.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        # shamefully-hoist is set in .npmrc and is required: the VitePress source
        # root (content/) is outside website/, so vue must resolve from the root.
        run: pnpm install --frozen-lockfile

      - name: Check for pre-publication placeholders
        run: pnpm run check:placeholders

      - name: Check internal links
        run: pnpm run check:links

      - name: Build site
        run: pnpm run build

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/.vitepress/dist

  # Deploy only from main: a pull request should build and check, never publish.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
