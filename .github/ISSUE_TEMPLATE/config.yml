blank_issues_enabled: true
contact_links:
  # Repository-relative links (VERIFIED.md, PLAN.md) are deliberately NOT listed
  # here: GitHub requires absolute URLs for contact links, which would embed the
  # repository URL and leave a pre-publication placeholder in a published file.
  # The issue forms link to those files in their own body text instead, and
  # scripts/check-placeholders.mjs enforces that no placeholder ships.
  - name: DeepSeek Harness itself
    url: https://github.com/deepseek-ai/deepseek-harness/discussions
    about: Questions or bugs about DeepSeek Harness rather than this curriculum belong upstream.
