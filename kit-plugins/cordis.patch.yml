# Bundle plugin-row reference
#
# Plugin rows reference this package BY NAME rather than by relative file path.
# That is not a style choice: a relative path resolves to a source file whose
# `@deepseek-ai/*` imports cannot be resolved from outside a dsh installation
# (pnpm symlinks only declared dependencies). Rows named by package resolve
# through the profile's own installation, which is how external plugins work.
#
# Exercise rows are added here as each lesson is built. See content/lessons/.

- insert:
    - id: l1-hello
      name: dsh-exploration-kit-plugins/l1/hello.ts

    - id: l2-wordcount
      name: dsh-exploration-kit-plugins/l2/wordcount.js
      config:
        defaultUnit: lines

    # Opt-in diagnostic: calls word_count through the real pipeline so Lesson 2's tool
    # claim can be verified without a model. Enable with solutions/l2.probe.patch.yml.
    - id: l2-probe
      name: dsh-exploration-kit-plugins/l2/tool-probe.js
      disabled: true

    # Lesson 3: provide a service, then consume it in a separate plugin.
    # Set `disabled: true` here to strand the consumer in PENDING and watch
    # l3-diagnose report it.
    - id: l3-clock
      name: dsh-exploration-kit-plugins/l3/clock.js

    - id: l3-uses-clock
      name: dsh-exploration-kit-plugins/l3/uses-clock.js

    - id: l3-diagnose
      name: dsh-exploration-kit-plugins/l3/diagnose.js
      config:
        match: 'l3-'

    # Lesson 4: waterfall policy plus an irreversible guard.
    - id: l4-write-scope
      name: dsh-exploration-kit-plugins/l4/write-scope.js
      config:
        # !!js is evaluated at load time. KIT_ROOT lets a learner point the sandbox
        # anywhere without editing this file.
        allowedRoot: !!js "process.env.KIT_ROOT ? process.env.KIT_ROOT + '/l4-sandbox' : undefined"

    - id: l4-guard
      name: dsh-exploration-kit-plugins/l4/guard.js

    # Opt-in diagnostic: dispatches synthetic tool calls so Lesson 4's policy decisions
    # can be verified without a model. Enable with solutions/l4.probe.patch.yml.
    - id: l4-probe
      name: dsh-exploration-kit-plugins/l4/policy-probe.js
      disabled: true

    # Lesson 5: a human command that needs no model turn.
    - id: l5-commands
      name: dsh-exploration-kit-plugins/l5/commands.js

    # Lesson 5: observe the turn flow, then inject durable context.
    - id: l5-observer
      name: dsh-exploration-kit-plugins/l5/turn-observer.js

    - id: l5-inject
      name: dsh-exploration-kit-plugins/l5/inject.js

    # Lesson 6: a durable session event and the projection that folds it.
    - id: l6-counter
      name: dsh-exploration-kit-plugins/l6/counter.js

    - id: l6-projection
      name: dsh-exploration-kit-plugins/l6/projection.js

    # Opt-in diagnostic: creates a session, appends l6/step events, and reads the folded
    # projection, verifying Lesson 6 without a model. See solutions/l6.probe.patch.yml.
    - id: l6-probe
      name: dsh-exploration-kit-plugins/l6/projection-probe.js
      disabled: true
