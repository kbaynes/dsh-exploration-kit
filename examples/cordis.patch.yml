# Bundle plugin-row reference
#
# Plugin rows reference this package BY NAME rather than by relative file path.
# That is not a style choice: a relative path resolves to a source file whose
# `@deepseek-ai/*` imports cannot be resolved from outside a dsh installation
# (pnpm symlinks only declared dependencies). Rows named by package resolve
# through the profile's own installation, which is how external plugins work.
#
# Exercise rows are added here as each lesson is built. See content/lessons/.

- insert:
    - id: l1-hello
      name: dsh-exploration-kit-plugins/l1/hello.ts

    - id: l2-wordcount
      name: dsh-exploration-kit-plugins/l2/wordcount.js
      config:
        defaultUnit: lines

    # Opt-in diagnostic: calls word_count through the real pipeline so Lesson 2's tool
    # claim can be verified without a model. Enable with solutions/l2.probe.patch.yml.
    - id: l2-probe
      name: dsh-exploration-kit-plugins/l2/tool-probe.js
      disabled: true

    # Lesson 3: provide a service, then consume it in a separate plugin.
    # Set `disabled: true` here to strand the consumer in PENDING and watch
    # l3-diagnose report it.
    - id: l3-clock
      name: dsh-exploration-kit-plugins/l3/clock.js

    - id: l3-uses-clock
      name: dsh-exploration-kit-plugins/l3/uses-clock.js

    - id: l3-diagnose
      name: dsh-exploration-kit-plugins/l3/diagnose.js
      config:
        match: 'l3-'

    # Lesson 4: waterfall policy plus an irreversible guard.
    - id: l4-write-scope
      name: dsh-exploration-kit-plugins/l4/write-scope.js
      config:
        # !!js is evaluated at load time. KIT_ROOT lets a learner point the sandbox
        # anywhere without editing this file.
        allowedRoot: !!js "process.env.KIT_ROOT ? process.env.KIT_ROOT + '/l4-sandbox' : undefined"

    - id: l4-guard
      name: dsh-exploration-kit-plugins/l4/guard.js

    # Opt-in diagnostic: dispatches synthetic tool calls so Lesson 4's policy decisions
    # can be verified without a model. Enable with solutions/l4.probe.patch.yml.
    # Opt-in diagnostic: creates a scheduled task so Lesson 9's persistence claim can be
    # verified without a model. Needs the web-backed profile (ADR-0016) and the opt-in
    # schedule package. See solutions/l9.probe.patch.yml.
    # Opt-in diagnostic: seeds a child session from a parent's events, so Lesson 8's fork
    # heredity can be tested without a model. See solutions/l8.probe.patch.yml.
    - id: l8-probe
      name: dsh-exploration-kit-plugins/l8/fork-probe.js
      disabled: true

    # Opt-in diagnostic: schedules a task that FIRES, so Lesson 9's delivery claim (a due task
    # resumes the session and the agent works on it) is testable against the mock provider.
    - id: l9-fire-probe
      name: dsh-exploration-kit-plugins/l9/fire-probe.js
      disabled: true

    - id: l9-probe
      name: dsh-exploration-kit-plugins/l9/schedule-probe.js
      disabled: true

    # Opt-in diagnostic: toggles a plugin row through ctx.pluginManager, so Lesson 3's
    # runtime-management claim is testable without a model. See solutions/l3.probe.patch.yml.
    # Diagnostic: finds the entry whose plugin Config is not a schema, which is what makes a turn
    # fail inside DSH's settings plugin. See solutions/l3.audit.patch.yml
    - id: l3-config-audit
      name: dsh-exploration-kit-plugins/l3/config-audit.js
      disabled: true

    - id: l3-probe
      name: dsh-exploration-kit-plugins/l3/manager-probe.js
      disabled: true

    - id: l4-probe
      name: dsh-exploration-kit-plugins/l4/policy-probe.js
      disabled: true

    # Lesson 5: a human command that needs no model turn.
    - id: l5-commands
      name: dsh-exploration-kit-plugins/l5/commands.js

    # Opt-in diagnostic: tests whether injected context survives a restart, which is
    # Lesson 5's durability claim. See solutions/l5.probe.patch.yml.
    # Opt-in diagnostic: dispatches /l5-facts through ctx.commands.execute, so Lesson 5's
    # "no model turn" command claim is testable without a model. See solutions/l5.cmd.patch.yml.
    - id: l5-cmd-probe
      name: dsh-exploration-kit-plugins/l5/command-probe.js
      disabled: true

    # Opt-in diagnostic: runs a turn and checks the model-visible skill catalogue in the log, so
    # Lesson 5's catalogue claim is testable against the mock provider. See solutions/l5.cat.patch.yml
    - id: l5-catalogue-probe
      name: dsh-exploration-kit-plugins/l5/catalogue-probe.js
      disabled: true

    - id: l5-probe
      name: dsh-exploration-kit-plugins/l5/context-probe.js
      disabled: true

    # Lesson 5: observe the turn flow, then inject durable context.
    - id: l5-observer
      name: dsh-exploration-kit-plugins/l5/turn-observer.js

    - id: l5-inject
      name: dsh-exploration-kit-plugins/l5/inject.js

    # Lesson 6: a durable session event and the projection that folds it.
    # DELIBERATE HAZARD, disabled by default: this invents a session event type, which
    # makes the session unreadable after a restart. Lesson 6 enables it via
    # solutions/l6.hazard.patch.yml to demonstrate the failure. Never copy this pattern.
    - id: l6-hazard
      name: dsh-exploration-kit-plugins/l6/hazard-custom-event.js
      disabled: true

    - id: l6-projection
      name: dsh-exploration-kit-plugins/l6/projection.js

    # Opt-in diagnostic: creates a session, appends l6/step events, and reads the folded
    # projection, verifying Lesson 6 without a model. See solutions/l6.probe.patch.yml.
    - id: l6-probe
      name: dsh-exploration-kit-plugins/l6/projection-probe.js
      disabled: true

    # Opt-in diagnostic: queries session history through ctx.sessionQuery, verifying
    # Lesson 7's substance without a model. See solutions/l7.probe.patch.yml.
    # Opt-in diagnostic: runs a real turn against the mock provider so Lesson 7's accounting,
    # statistics, search and /compact claims are testable without a key. See solutions/l7.turn.patch.yml
    - id: l7-turn-probe
      name: dsh-exploration-kit-plugins/l7/turn-probe.js
      disabled: true

    - id: l7-probe
      name: dsh-exploration-kit-plugins/l7/query-probe.js
      disabled: true

    # Opt-in diagnostic: drives a REAL cross-workspace tool call, so Lesson 7's
    # workspace-authority refusal is testable with a model-driven call but no key.
    # See solutions/l7.auth.patch.yml.
    - id: l7-authority-probe
      name: dsh-exploration-kit-plugins/l7/authority-probe.js
      disabled: true
